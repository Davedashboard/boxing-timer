name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Bundle the web timer into the app
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html *.png android/app/src/main/assets/www/

      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../RoundTimer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RoundTimer
          path: RoundTimer.apk

      - name: Publish to "latest" release (open this on your phone to install)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest RoundTimer.apk \
            --title "Round Timer (build ${{ github.run_number }})" \
            --notes "Tap RoundTimer.apk below to download and install." \
            --target ${{ github.sha }}
